name: Runtime validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate diagnostic and recorder fixtures
        run: node --test --test-concurrency=1 scripts/*.test.mjs scripts/browser/*.test.mjs

  real-guest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TERRARIUM_QEMU_ASSET_DIR: .cache/qemu
      TERRARIUM_BROWSER_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache and verify the published runtime
        run: node scripts/cache-qemu-assets.mjs
      - run: npm run test:qemu
      - run: npm run test:qemu-storage
      - run: npm run test:qemu-network
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
